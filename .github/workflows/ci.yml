name: CI

on:
  push:
  pull_request:

jobs:
  pack-and-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python tools/sync-composite.py --check
      - run: python -m unittest tests.test_pack_structure -v
      - run: node tests/skills-cli-smoke.mjs

  auto-resume:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q skills tests tools
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  powershell-bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tests/install-agents.tests.ps1
      - shell: pwsh
        run: ./tests/composite-install.tests.ps1
